# The news wire (docs/SPEC.md "News wire"): build today's edition and commit it; Vercel redeploys.
# Needs the ANTHROPIC_API_KEY repository secret.
name: News wire

on:
  schedule:
    - cron: '0 13 * * *' # 06:00 PDT / 05:00 PST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-wire
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits non-zero (and writes nothing) when nothing could be classified or the cost cap is
      # hit: the site keeps the last edition and GitHub emails the failure.
      - name: Build the edition
        run: npm run news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit the edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/news
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "News wire: $(TZ=America/Los_Angeles date +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
